version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: traployee-postgres
    environment:
      POSTGRES_DB: Traployee  # Capital T
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - traployee-network

  backend:
    build: .
    container_name: traployee-backend
    depends_on:
      - postgres
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/Traployee  # Capital T
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    ports:
      - "8080:8080"
    networks:
      - traployee-network

networks:
  traployee-network:
    driver: bridge

volumes:
  postgres_data: