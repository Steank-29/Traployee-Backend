spring.application.name=traployee-backend
# Server Configuration
server.port=8080

# Database Configuration (No password as you set up)
spring.datasource.url=jdbc:postgresql://localhost:5432/Traployee
spring.datasource.username=postgres
spring.datasource.password=
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Logging
logging.level.com.traployee=DEBUG
logging.level.org.springframework.web=INFO

# File upload size limits
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
# Additional upload settings
spring.servlet.multipart.enabled=true
spring.servlet.multipart.file-size-threshold=2KB
spring.servlet.multipart.location=/tmp

# Serve static files from external directory
spring.web.resources.static-locations=file:./Workflow/Screenshots/,classpath:/static/

