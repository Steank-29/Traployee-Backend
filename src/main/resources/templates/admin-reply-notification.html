<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin Feedback</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #161614;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #1a1a18;
            border: 1px solid #2a2a28;
            border-radius: 16px;
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #111110 0%, #1a1a18 100%);
            padding: 30px;
            text-align: center;
            border-bottom: 1px solid #2a2a28;
        }
        .header h1 {
            color: #a877ff;
            font-family: 'Syne', sans-serif;
            font-size: 28px;
            margin: 0;
        }
        .content {
            padding: 30px;
            color: #f0ede8;
        }
        .reply-box {
            background: #111110;
            border-left: 3px solid #a877ff;
            border-radius: 8px;
            padding: 15px;
            margin: 20px 0;
            font-style: italic;
        }
        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: 600;
        }
        .status-approved {
            background: rgba(90,223,140,0.15);
            color: #5adf8c;
        }
        .status-rejected {
            background: rgba(255,90,90,0.15);
            color: #ff5a5a;
        }
        .button {
            display: inline-block;
            padding: 12px 24px;
            background: linear-gradient(135deg, #c8f55a, #a8d540);
            color: #111;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            margin-top: 20px;
        }
        .footer {
            padding: 20px;
            text-align: center;
            border-top: 1px solid #2a2a28;
            color: #888882;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📨 Admin Feedback Received</h1>
        </div>
        <div class="content">
            <p>Hello <strong th:text="${employee.name}">Employee</strong>,</p>
            <p>Your assignment has been reviewed by the administrator.</p>
            
            <div class="reply-box">
                <strong>Feedback:</strong>
                <p th:text="${adminReply}">Your assignment looks great! Approved.</p>
            </div>
            
            <p><strong>New Status:</strong> 
                <span th:if="${newStatus == 'approved'}" class="status-badge status-approved">✅ Approved</span>
                <span th:if="${newStatus == 'rejected'}" class="status-badge status-rejected">❌ Rejected - Needs Changes</span>
            </p>
            
            <a href="http://localhost:1234/employee" class="button">View Assignment →</a>
        </div>
        <div class="footer">
            <p>&copy; <span th:text="${year}">2024</span> Traployee. All rights reserved.</p>
        </div>
    </div>
</body>
</html>
